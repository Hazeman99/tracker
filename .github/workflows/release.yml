# Pushing a tag like v1.2.3 builds everything and publishes a GitHub
# release: API binaries (linux amd64/arm64), the API Docker image on
# ghcr.io, the macOS desktop app (Apple Silicon) and Linux desktop
# packages (.deb/.rpm, amd64 and arm64), plus a SHA256SUMS file.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  api-binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - name: Build static linux binaries
        working-directory: api
        run: |
          version="${GITHUB_REF_NAME#v}"
          for arch in amd64 arm64; do
            out="tracker-api_${version}_linux_${arch}"
            mkdir -p "dist/$out"
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" \
              go build -trimpath -ldflags="-s -w" -o "dist/$out/tracker-api" ./cmd/tracker-api
            cp ../LICENSE "dist/$out/"
            tar -C dist -czf "dist/$out.tar.gz" "$out"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: api-binaries
          path: api/dist/*.tar.gz
          if-no-files-found: error

  api-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name (ghcr requires lowercase)
        id: image
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/tracker-api" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: api
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.image.outputs.version }}
            ${{ steps.image.outputs.name }}:latest

  desktop-macos:
    runs-on: macos-latest # Apple Silicon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: desktop/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json
      - name: Install the Wails CLI
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Build and package
        working-directory: desktop
        run: |
          export PATH="$(go env GOPATH)/bin:$PATH"
          wails3 package
          ditto -c -k --keepParent bin/tracker.app \
            "bin/tracker_${GITHUB_REF_NAME#v}_macos_arm64.app.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-macos
          path: desktop/bin/*.app.zip
          if-no-files-found: error

  desktop-linux:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: desktop/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json
      - name: Install GTK and WebKitGTK
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev
      - name: Install the Wails CLI
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Build and package
        working-directory: desktop
        env:
          # nfpm.yaml reads these for the package metadata.
          GOARCH: ${{ matrix.arch }}
          GIT_COMMITTER_NAME: Tracker contributors
          GIT_COMMITTER_EMAIL: noreply@github.com
        run: |
          export PATH="$(go env GOPATH)/bin:$PATH"
          version="${GITHUB_REF_NAME#v}"
          sed -i "s/^version:.*/version: \"$version\"/" build/linux/nfpm/nfpm.yaml
          wails3 build
          wails3 task linux:create:deb
          wails3 task linux:create:rpm
          tar -C bin -czf "bin/tracker_${version}_linux_${{ matrix.arch }}.tar.gz" tracker
          mv bin/*.deb "bin/tracker_${version}_linux_${{ matrix.arch }}.deb"
          mv bin/*.rpm "bin/tracker_${version}_linux_${{ matrix.arch }}.rpm"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-linux-${{ matrix.arch }}
          path: |
            desktop/bin/*.tar.gz
            desktop/bin/*.deb
            desktop/bin/*.rpm
          if-no-files-found: error

  publish:
    needs: [api-binaries, api-image, desktop-macos, desktop-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            dist/*
