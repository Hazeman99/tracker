# Tracker deployment: the API on an internal-only network, Caddy in front
# terminating TLS (automatic Let's Encrypt, or a self-signed certificate).
# Usage: cp .env.example .env && edit, then `docker compose up -d --build`.
# See the README.
name: tracker

services:
  api:
    build:
      context: ../api
    image: tracker-api:local
    # To run the published image instead of building locally, replace the
    # two lines above with:
    #   image: ghcr.io/hazeman99/tracker-api:latest
    restart: unless-stopped
    environment:
      TRACKER_LISTEN_ADDR: ":8080"
      TRACKER_DB_PATH: /data/tracker.db
      # Only requests from Caddy's fixed address may set X-Forwarded-For.
      TRACKER_TRUSTED_PROXY: 172.30.0.2
    volumes:
      - tracker-data:/data
    networks:
      backend:
        ipv4_address: 172.30.0.3
    # No ports published: reachable only from Caddy on the internal network.
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s

  caddy:
    image: caddy:2.11.9-alpine
    restart: unless-stopped
    depends_on: [api]
    # Published on TRACKER_BIND_IP (default: all interfaces). Port 80 serves
    # the ACME HTTP challenge and redirects everything else to HTTPS.
    ports:
      - "${TRACKER_BIND_IP:-0.0.0.0}:80:80"
      - "${TRACKER_BIND_IP:-0.0.0.0}:${TRACKER_HTTPS_PORT:-443}:${TRACKER_HTTPS_PORT:-443}"
      - "${TRACKER_BIND_IP:-0.0.0.0}:${TRACKER_HTTPS_PORT:-443}:${TRACKER_HTTPS_PORT:-443}/udp"
    environment:
      TRACKER_DOMAIN: ${TRACKER_DOMAIN:?set TRACKER_DOMAIN in deploy/.env}
      TRACKER_HTTPS_PORT: ${TRACKER_HTTPS_PORT:-443}
      TRACKER_TLS: ${TRACKER_TLS:-internal}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates (ACME account or the local CA) live in caddy-data.
      - caddy-data:/data
      - caddy-config:/config
    networks:
      edge:
        # Ports are published through this network and ACME needs outbound
        # internet, so it must be Caddy's gateway rather than the internal
        # one. Requires Docker Engine 28+.
        gw_priority: 1
      backend:
        ipv4_address: 172.30.0.2
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true

networks:
  # Network through which Caddy's ports are published; only Caddy joins it.
  edge: {}
  # Internal network with no route to the outside world.
  backend:
    internal: true
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  tracker-data:
  caddy-data:
  caddy-config:
