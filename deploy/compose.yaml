# Tracker deployment: the API on an internal-only network, Caddy in front,
# published only on the server's Tailscale address.
# Usage: cp .env.example .env && edit, ./renew-cert.sh, then
# `docker compose up -d --build`. See README section 1.
name: tracker

services:
  api:
    build:
      context: ../api
    image: tracker-api:local
    restart: unless-stopped
    environment:
      TRACKER_LISTEN_ADDR: ":8080"
      TRACKER_DB_PATH: /data/tracker.db
      # Only requests from Caddy's fixed address may set X-Forwarded-For.
      TRACKER_TRUSTED_PROXY: 172.30.0.2
    volumes:
      - tracker-data:/data
    networks:
      backend:
        ipv4_address: 172.30.0.3
    # No ports published: reachable only from Caddy on the internal network.
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s

  caddy:
    image: caddy:2.11.9-alpine
    restart: unless-stopped
    depends_on: [api]
    # Published on the Tailscale IP only: unreachable from the public
    # internet and the LAN. Port 80 only redirects to HTTPS.
    ports:
      - "${TRACKER_BIND_IP:?set TRACKER_BIND_IP in deploy/.env}:80:80"
      - "${TRACKER_BIND_IP}:${TRACKER_HTTPS_PORT:-8443}:${TRACKER_HTTPS_PORT:-8443}"
      - "${TRACKER_BIND_IP}:${TRACKER_HTTPS_PORT:-8443}:${TRACKER_HTTPS_PORT:-8443}/udp"
    environment:
      TRACKER_DOMAIN: ${TRACKER_DOMAIN:?set TRACKER_DOMAIN in deploy/.env}
      TRACKER_HTTPS_PORT: ${TRACKER_HTTPS_PORT:-8443}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificate fetched on the host by renew-cert.sh (`tailscale cert`).
      # The tailscaled socket is deliberately NOT mounted into the container.
      - ./certs:/certs:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      edge:
        # Ports are published through this network, so it must be Caddy's
        # gateway rather than the internal one. Requires Docker Engine 28+.
        gw_priority: 1
      backend:
        ipv4_address: 172.30.0.2
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true

networks:
  # Network through which Caddy's ports are published; only Caddy joins it.
  edge: {}
  # Internal network with no route to the outside world.
  backend:
    internal: true
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  tracker-data:
  caddy-data:
  caddy-config:
