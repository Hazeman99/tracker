# Tracker deployment: the API on an internal-only network, Caddy in front.
# Usage: cp .env.example .env && edit, then `docker compose up -d --build`.
name: tracker

services:
  api:
    build:
      context: ../api
    image: tracker-api:local
    restart: unless-stopped
    environment:
      TRACKER_LISTEN_ADDR: ":8080"
      TRACKER_DB_PATH: /data/tracker.db
      # Only requests from Caddy's fixed address may set X-Forwarded-For.
      TRACKER_TRUSTED_PROXY: 172.30.0.2
    volumes:
      - tracker-data:/data
    networks:
      backend:
        ipv4_address: 172.30.0.3
    # No ports published: reachable only from Caddy on the internal network.
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s

  caddy:
    image: caddy:2.11.9-alpine
    restart: unless-stopped
    depends_on: [api]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      TRACKER_DOMAIN: ${TRACKER_DOMAIN:?set TRACKER_DOMAIN in deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      edge:
        # Caddy's default route (and DNS) must go through the internet-facing
        # network, never the internal one. Requires Docker Engine 28+.
        gw_priority: 1
      backend:
        ipv4_address: 172.30.0.2
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true

networks:
  # Internet-facing network; only Caddy joins it.
  edge: {}
  # Internal network with no route to the outside world.
  backend:
    internal: true
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  tracker-data:
  caddy-data:
  caddy-config:
